# CryoAtlas addition: installable package metadata and CLI registration.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryoatlas-modelangelo"
version = "1.0.16.post1"
description = "ModelAngelo inference and CryoAtlas CNN training"
requires-python = ">=3.10,<3.13"
dynamic = ["dependencies"]

[project.scripts]
model_angelo = "model_angelo.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.packages.find]
include = ["model_angelo*"]
namespaces = true

[tool.setuptools.package-data]
model_angelo = ["utils/stereo_chemical_props.txt", "model_definitions/**/*.py"]
